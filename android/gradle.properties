org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The Kotlin compile daemon is a separate JVM and does not inherit the setting
# above. Without this it reads sources in the platform default encoding, which
# on Windows corrupts every non-ASCII literal in the engine.
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
